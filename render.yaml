# Render blueprint for the Django REST API.
# The Next.js frontend is deployed separately on Vercel.
#
# Values prompted when you apply the blueprint (marked sync: false below):
#   DATABASE_URL             -> the Neon connection string (?sslmode=require)
#   ALLOWED_HOSTS            -> portfolio-api.onrender.com (the real Render host is
#                               also added automatically via RENDER_EXTERNAL_HOSTNAME)
#   CORS_ALLOWED_ORIGINS     -> https://<your-frontend>.vercel.app
#   CSRF_TRUSTED_ORIGINS     -> https://<your-frontend>.vercel.app
#   DJANGO_SUPERUSER_PASSWORD -> a password for the admin account
#
# Optional — only needed for Admin-uploaded images/PDFs to persist and be
# servable in production (Render's own disk is wiped on every deploy).
# Create a Supabase project + a *public* Storage bucket, then fill in:
#   SUPABASE_URL             -> https://<project-ref>.supabase.co
#   SUPABASE_BUCKET_NAME     -> the bucket name (e.g. "media")
#   SUPABASE_S3_REGION       -> region shown in Storage > S3 Connection
#   AWS_ACCESS_KEY_ID        -> S3 access key from Storage > S3 Connection
#   AWS_SECRET_ACCESS_KEY    -> S3 secret key from the same panel
# Leave all of these unset and Admin uploads just won't persist — everything
# else on the site keeps working.
services:
  - type: web
    name: portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Free tier has 512 MB RAM — one worker is the safe choice.
      # Bump this on a paid plan.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Admin account, created on first deploy by build.sh.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: kalambodaniel143@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Optional Supabase Storage config — see the comment block above.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_BUCKET_NAME
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
