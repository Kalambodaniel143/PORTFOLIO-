# Render blueprint for the Django REST API.
# The Next.js frontend is deployed separately on Vercel.
#
# After the first deploy, set these in the Render dashboard (Environment):
#   DATABASE_URL          -> the Neon connection string (?sslmode=require)
#   ALLOWED_HOSTS         -> portfolio-api-xxxx.onrender.com
#   CORS_ALLOWED_ORIGINS  -> https://<your-frontend>.vercel.app
#   CSRF_TRUSTED_ORIGINS  -> https://<your-frontend>.vercel.app
services:
  - type: web
    name: portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
