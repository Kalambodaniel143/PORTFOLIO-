# Render blueprint for the Django REST API.
# The Next.js frontend is deployed separately on Vercel.
#
# Values prompted when you apply the blueprint (marked sync: false below):
#   DATABASE_URL             -> the Neon connection string (?sslmode=require)
#   ALLOWED_HOSTS            -> portfolio-api.onrender.com (the real Render host is
#                               also added automatically via RENDER_EXTERNAL_HOSTNAME)
#   CORS_ALLOWED_ORIGINS     -> https://<your-frontend>.vercel.app
#   CSRF_TRUSTED_ORIGINS     -> https://<your-frontend>.vercel.app
#   DJANGO_SUPERUSER_PASSWORD -> a password for the admin account
services:
  - type: web
    name: portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Free tier has 512 MB RAM — one worker is the safe choice.
      # Bump this on a paid plan.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Admin account, created on first deploy by build.sh.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: kalambodaniel143@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
